services:
  grimoire-app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your environment or .env file}
      ADMIN_PASSCODE: ${ADMIN_PASSCODE:-}
      HOST: 0.0.0.0
      PORT: 5000
      FLASK_DEBUG: "0"
    restart: unless-stopped
